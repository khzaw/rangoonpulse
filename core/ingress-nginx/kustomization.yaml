# yaml-language-server: $schema=https://www.schemastore.org/kustomization.json
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.1/deploy/static/provider/baremetal/deploy.yaml
  - custom-headers.yaml
  - metrics-service.yaml

patches:
  # Patch 1: Change Service type and pin the shared ingress VIP
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: ingress-nginx-controller
        namespace: ingress-nginx
        annotations:
          metallb.io/allow-shared-ip: ingress-nginx-shared-vip
      spec:
        type: LoadBalancer
        loadBalancerIP: ${INGRESS_VIP}
        externalTrafficPolicy: Local

  # Patch 2: Add the missing --publish-service argument to the Deployment
  #  path: /spec/template/spec/containers/0/args/- uses JSON Patch syntax to append (add to path ending in -) the value to the existing args array for the first container).
  - patch: |-
      # Append the argument to the existing args list for the first container
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --publish-service=$(POD_NAMESPACE)/ingress-nginx-controller
    target:
      kind: Deployment
      name: ingress-nginx-controller
      namespace: ingress-nginx

  # Patch 3: Set security defaults and reference custom response headers
  - patch: |-
      - op: remove
        path: /data
      - op: add
        path: /data
        value:
          add-headers: "ingress-nginx/ingress-nginx-custom-headers"
          gzip-level: "5"
          hide-headers: "X-Powered-By,Server"
          use-gzip: "true"
    target:
      kind: ConfigMap
      name: ingress-nginx-controller
      namespace: ingress-nginx

  # Patch 4: Keep ingress-nginx burstable, but bound runaway CPU/memory use.
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: 500m
          memory: 512Mi
    target:
      kind: Deployment
      name: ingress-nginx-controller
      namespace: ingress-nginx

  # Patch 5: Export lean request metrics on :10254 (series budget in docs/networking.md).
  # Counters are per Ingress with status classes; per-request histograms are never computed.
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --enable-metrics=true
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --metrics-per-host=false
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --report-status-classes=true
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --exclude-socket-metrics=nginx_ingress_controller_connect_duration_seconds,nginx_ingress_controller_header_duration_seconds,nginx_ingress_controller_response_duration_seconds,nginx_ingress_controller_request_duration_seconds,nginx_ingress_controller_request_size,nginx_ingress_controller_response_size,nginx_ingress_controller_bytes_sent
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          name: metrics
          containerPort: 10254
          protocol: TCP
    target:
      kind: Deployment
      name: ingress-nginx-controller
      namespace: ingress-nginx

  # Patch 6: Hard-pin the controller to the primary and roll it surge-first (docs/networking.md).
  # externalTrafficPolicy: Local announces the VIP from the node running the Ready controller.
  # No pod anti-affinity (blocks the same-node surge) and no PDB (blocks drains on one replica).
  - patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector/kubernetes.io~1hostname
        value: ${PRIMARY_NODE_NAME}
      - op: replace
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
      - op: replace
        path: /spec/minReadySeconds
        value: 5
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --shutdown-grace-period=5
    target:
      kind: Deployment
      name: ingress-nginx-controller
      namespace: ingress-nginx
