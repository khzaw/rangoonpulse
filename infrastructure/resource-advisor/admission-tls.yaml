apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: resource-advisor-admission-selfsigned
  namespace: monitoring
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: resource-advisor-admission-ca
  namespace: monitoring
spec:
  isCA: true
  commonName: resource-advisor-admission-ca
  secretName: resource-advisor-admission-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: resource-advisor-admission-selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: resource-advisor-admission-ca
  namespace: monitoring
spec:
  ca:
    secretName: resource-advisor-admission-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: resource-advisor-admission
  namespace: monitoring
spec:
  secretName: resource-advisor-admission-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - resource-advisor-exporter.monitoring.svc
    - resource-advisor-exporter.monitoring.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: resource-advisor-admission-ca
