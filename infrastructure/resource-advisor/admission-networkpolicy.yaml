apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resource-advisor-admission
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: resource-advisor-exporter
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8081
    - from:
        - ipBlock:
            cidr: ${PRIMARY_NODE_IP}/32
        - ipBlock:
            cidr: ${UTILITY_NODE_IP}/32
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: resource-advisor-exporter
      ports:
        - protocol: TCP
          port: 8443
