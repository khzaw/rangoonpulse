# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.32.0-standalone-strict/all.json
---
# local-path volumes are hostPath directories, so the kubelet never reports
# kubelet_volume_stats_* for them. This DaemonSet walks the provisioner
# directories with `du` every five minutes, writes the result as Prometheus
# text into an emptyDir, and serves it with busybox httpd for a PodMonitor.
# Labels come from the directory name: pvc-<uid>_<namespace>_<claim>.
#
# Shell expansions are written as $${...} because this Kustomization runs
# Flux post-build substitution; Flux rewrites them to ${...}.
#
# It does not use node-exporter's textfile collector: Talos keeps /var/lib at
# 0700 and /var/mnt read-only, so there is no host path a root writer and the
# UID 65534 node-exporter can both use.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-usage-exporter
  namespace: local-path-storage
data:
  collect.sh: |
    #!/bin/sh
    # Emit metrics for every local-path PVC directory on this node.
    set -u
    ROOT="$${HOST_VAR:-/host/var}"
    NODE="$${NODE_NAME:-unknown}"
    echo "# HELP local_path_pvc_used_bytes Apparent bytes used inside a local-path PVC directory."
    echo "# TYPE local_path_pvc_used_bytes gauge"
    for dir in "$ROOT"/mnt/local-path-provisioner/pvc-* "$ROOT"/lib/local-path-provisioner/pvc-*; do
      [ -d "$dir" ] || continue
      base="$${dir##*/}"
      volume="$${base%%_*}"
      rest="$${base#*_}"
      ns="$${rest%%_*}"
      claim="$${rest#*_}"
      kb="$(du -sk "$dir" 2>/dev/null | cut -f1)"
      [ -n "$kb" ] || continue
      echo "local_path_pvc_used_bytes{namespace=\"$ns\",persistentvolumeclaim=\"$claim\",volumename=\"$volume\",node=\"$NODE\"} $((kb * 1024))"
    done
    echo "# HELP local_path_pvc_exporter_last_run_timestamp_seconds Unix time of the last completed walk on this node."
    echo "# TYPE local_path_pvc_exporter_last_run_timestamp_seconds gauge"
    echo "local_path_pvc_exporter_last_run_timestamp_seconds{node=\"$NODE\"} $(date +%s)"
  run.sh: |
    #!/bin/sh
    # Serve /metrics from an emptyDir and refresh it atomically so a scrape
    # never sees a half-written file.
    set -u
    WWW="$${WWW_DIR:-/www}"
    OUT="$WWW/metrics"
    : > "$OUT"
    httpd -f -p "$${PORT:-9101}" -h "$WWW" &
    while true; do
      if sh /opt/exporter/collect.sh > "$OUT.tmp"; then
        mv "$OUT.tmp" "$OUT"
      else
        rm -f "$OUT.tmp"
      fi
      sleep "$${INTERVAL_SECONDS:-300}"
    done
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: local-path-usage-exporter
  namespace: local-path-storage
  labels:
    app.kubernetes.io/name: local-path-usage-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: local-path-usage-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-path-usage-exporter
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: exporter
          image: busybox:1.37
          command: ["sh", "/opt/exporter/run.sh"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_VAR
              value: /host/var
            - name: WWW_DIR
              value: /www
            - name: PORT
              value: "9101"
            - name: INTERVAL_SECONDS
              value: "300"
          ports:
            - name: metrics
              containerPort: 9101
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            # Root plus DAC_READ_SEARCH so du can enter directories owned by
            # arbitrary app UIDs; nothing is written outside the emptyDir.
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
          volumeMounts:
            - name: script
              mountPath: /opt/exporter
              readOnly: true
            - name: host-var
              mountPath: /host/var
              readOnly: true
            - name: www
              mountPath: /www
      volumes:
        - name: script
          configMap:
            name: local-path-usage-exporter
        - name: host-var
          hostPath:
            path: /var
            type: Directory
        - name: www
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: local-path-usage-exporter
  namespace: local-path-storage
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: local-path-usage-exporter
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      # The exporter's own namespace label names the PVC's namespace, not
      # local-path-storage; keep it.
      honorLabels: true
