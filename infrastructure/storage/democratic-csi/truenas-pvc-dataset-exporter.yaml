# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.32.0-standalone-strict/all.json
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: truenas-pvc-dataset-exporter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: truenas-pvc-dataset-exporter
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: truenas-pvc-dataset-exporter
subjects:
  - kind: ServiceAccount
    name: truenas-pvc-dataset-exporter
    namespace: democratic-csi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: truenas-pvc-dataset-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenas-pvc-dataset-exporter
  labels:
    app.kubernetes.io/name: truenas-pvc-dataset-exporter
    app.kubernetes.io/part-of: democratic-csi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: truenas-pvc-dataset-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: truenas-pvc-dataset-exporter
        app.kubernetes.io/part-of: democratic-csi
    spec:
      serviceAccountName: truenas-pvc-dataset-exporter
      nodeSelector:
        kubernetes.io/hostname: ${PRIMARY_NODE_NAME}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: python:3.15-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/opt/truenas-pvc-dataset-exporter/exporter.py"]
          env:
            - name: PORT
              value: "9118"
            - name: TRUENAS_API_BASE
              value: http://${NAS_IP}/api/v2.0
            - name: TRUENAS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: truenas-credentials
                  key: username
            - name: TRUENAS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: truenas-credentials
                  key: password
          ports:
            - name: http
              containerPort: 9118
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 30
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: exporter-script
              mountPath: /opt/truenas-pvc-dataset-exporter
              readOnly: true
      volumes:
        - name: exporter-script
          configMap:
            name: truenas-pvc-dataset-exporter-script
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: truenas-pvc-dataset-exporter
  labels:
    app.kubernetes.io/name: truenas-pvc-dataset-exporter
    app.kubernetes.io/part-of: democratic-csi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: truenas-pvc-dataset-exporter
  ports:
    - name: http
      port: 9118
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: truenas-pvc-dataset-exporter
  labels:
    app.kubernetes.io/name: truenas-pvc-dataset-exporter
    app.kubernetes.io/part-of: democratic-csi
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: truenas-pvc-dataset-exporter
  endpoints:
    - port: http
      path: /metrics
      interval: 120s
      scrapeTimeout: 30s
    # Separate endpoint/failure domain, same process and port. No NAS dependency
    # during startup, and power failures cannot suppress PVC dataset metrics.
    - port: http
      path: /power
      honorLabels: true
      interval: 120s
      scrapeTimeout: 15s
      relabelings:
        - targetLabel: host
          replacement: truenas
        - targetLabel: telemetry
          replacement: power
