# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-hdd
  namespace: democratic-csi
spec:
  interval: 24h
  chart:
    spec:
      chart: democratic-csi
      version: "0.15.1"
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
  values:
    csiDriver:
      name: "org.democratic-csi.nfs-hdd"

    controller:
      enabled: true
      nodeSelector:
        kubernetes.io/hostname: ${PRIMARY_NODE_NAME}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      extraContainers:
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.20.0@sha256:19f2cf2f40e1987c7943945deca5f65cd4e4bf5cc0657fc78a5df131861578e8
          args:
            - --csi-address=/csi-data/csi.sock.internal
            - --http-endpoint=127.0.0.1:9811
            - --probe-timeout=15s
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            # The driver's internal socket is root-owned mode 0600.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: socket-dir
              mountPath: /csi-data
              readOnly: true
      externalAttacher:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      externalProvisioner:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      externalResizer:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      externalSnapshotter:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      driver:
        image:
          # Preserve the installed multi-architecture build across pod replacement.
          tag: next@sha256:0f308ae601474cb9633f90dc96f59dbd23440b0ed0e77d70e224465246a12dfa
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi

    node:
      enabled: true
      cleanup:
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
      driver:
        image:
          # Preserve the installed multi-architecture build across pod replacement.
          tag: next@sha256:0f308ae601474cb9633f90dc96f59dbd23440b0ed0e77d70e224465246a12dfa
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
      driverRegistrar:
        extraArgs:
          - --http-endpoint=127.0.0.1:9809
        resources:
          requests:
            cpu: 20m
            memory: 48Mi
          limits:
            memory: 128Mi

    csiProxy:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi

    storageClasses:
      - name: truenas-nfs
        defaultClass: true
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: nfs
        mountOptions:
          - noatime
          - nfsvers=4.1

      - name: truenas-hdd-media
        defaultClass: false
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: nfs
        mountOptions:
          - noatime
          - nfsvers=4.1

    driver:
      config:
        driver: freenas-api-nfs
        instance_id: "truenas-nfs-hdd"
        httpConnection:
          protocol: http
          host: ${NAS_IP}
          port: 80
          allowInsecure: true
          apiVersion: 2
        zfs:
          datasetParentName: tank/k8s/storage
          detachedSnapshotsDatasetParentName: tank/k8s/snapshots
          datasetEnableQuotas: true
          datasetEnableReservation: true
          datasetPermissionsMode: "0777"
          datasetPermissionsUser: 0
          datasetPermissionsGroup: 0
          datasetProperties:
            "org.freenas:description": "{{ parameters.[csi.storage.k8s.io/pvc/namespace] }}/{{ parameters.[csi.storage.k8s.io/pvc/name] }}"
        nfs:
          shareHost: ${NAS_IP}
          shareAllowedNetworks: ["10.0.0.0/8"]
          shareMaprootUser: ""
          shareMaprootGroup: ""
          shareMapallUser: root
          shareMapallGroup: root

  # Chart 0.15.1 hardcodes probes/cleanup and has no node extraContainers value.
  postRenderers:
    - kustomize:
        patches:
          # Preserve an explicit null through rendering so Helm removes the API's
          # default rollingUpdate field. Fixed loopback listeners cannot overlap.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: democratic-csi-hdd-controller
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
                  rollingUpdate: null
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: democratic-csi-hdd-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: democratic-csi-hdd-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: csi-driver
                        livenessProbe:
                          exec: null
                          httpGet:
                            host: 127.0.0.1
                            port: 9811
                            path: /healthz
                          initialDelaySeconds: 10
                          periodSeconds: 60
                          timeoutSeconds: 15
                          failureThreshold: 3
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: democratic-csi-hdd-node
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: democratic-csi-hdd-node
              spec:
                template:
                  spec:
                    containers:
                      - name: liveness-probe
                        image: registry.k8s.io/sig-storage/livenessprobe:v2.20.0@sha256:19f2cf2f40e1987c7943945deca5f65cd4e4bf5cc0657fc78a5df131861578e8
                        args:
                          - --csi-address=/csi-data/csi.sock.internal
                          - --http-endpoint=127.0.0.1:9812
                          - --probe-timeout=15s
                        resources:
                          requests:
                            cpu: 5m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 64Mi
                        securityContext:
                          # The driver's internal socket is root-owned mode 0600.
                          runAsUser: 0
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: [ALL]
                          seccompProfile:
                            type: RuntimeDefault
                        volumeMounts:
                          - name: socket-dir
                            mountPath: /csi-data
                            readOnly: true
                      - name: csi-driver
                        livenessProbe:
                          exec: null
                          httpGet:
                            host: 127.0.0.1
                            port: 9812
                            path: /healthz
                          initialDelaySeconds: 10
                          periodSeconds: 60
                          timeoutSeconds: 15
                          failureThreshold: 3
                      - name: driver-registrar
                        livenessProbe:
                          exec: null
                          httpGet:
                            host: 127.0.0.1
                            port: 9809
                            path: /healthz
                          periodSeconds: 10
                          timeoutSeconds: 1
                          failureThreshold: 3
                      - name: cleanup
                        command: ["sleep"]
                        args: ["infinity"]

  valuesFrom:
    - kind: Secret
      name: truenas-credentials
      valuesKey: username
      targetPath: driver.config.httpConnection.username
    - kind: Secret
      name: truenas-credentials
      valuesKey: password
      targetPath: driver.config.httpConnection.password
