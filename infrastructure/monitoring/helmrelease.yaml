# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 24h
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "93.9.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          # Append to the chart's metric relabelings instead of replacing them.
          # Every dropped family has no loaded rule, provisioned dashboard, or
          # repository query consumer (docs/prometheus-storage.md). Histogram
          # drops remove only `_bucket` series; `_count`/`_sum` stay for rates.
          - target:
              group: monitoring.coreos.com
              version: v1
              kind: ServiceMonitor
              name: kube-prometheus-stack-apiserver
            patch: |-
              - op: add
                path: /spec/endpoints/0/metricRelabelings/-
                value:
                  action: drop
                  sourceLabels: [__name__]
                  regex: apiserver_(request_body_size_bytes|watch_list_duration_seconds|watch_cache_read_wait_seconds|watch_events_sizes|response_sizes)_bucket
              # Latency SLO, burn-rate and dashboard queries read
              # apiserver_request_sli_duration_seconds instead.
              - op: add
                path: /spec/endpoints/0/metricRelabelings/-
                value:
                  action: drop
                  sourceLabels: [__name__]
                  regex: (apiserver_request|etcd_request)_duration_seconds_bucket
              - op: add
                path: /spec/endpoints/0/metricRelabelings/-
                value:
                  action: drop
                  sourceLabels: [__name__]
                  regex: (apiserver_admission_(controller|step|webhook)_admission_duration_seconds|apiserver_flowcontrol_[a-z_]+|apiserver_request_filter_duration_seconds|apiserver_storage_transformation_duration_seconds|apiserver_(crd_)?conversion_webhook_duration_seconds|apiserver_impersonation_[a-z_]+|authentication_duration_seconds|authentication_token_cache_request_duration_seconds|authorization_duration_seconds|field_validation_request_duration_seconds|node_authorizer_graph_actions_duration_seconds|rest_client_(request|response)_size_bytes|workqueue_work_duration_seconds)_bucket
              - op: add
                path: /spec/endpoints/0/metricRelabelings/-
                value:
                  action: drop
                  sourceLabels: [__name__]
                  regex: kubernetes_feature_enabled
          # Endpoint order is chart-defined; the tests fail the release instead
          # of attaching a filter to the wrong kubelet endpoint after an upgrade.
          - target:
              group: monitoring.coreos.com
              version: v1
              kind: ServiceMonitor
              name: kube-prometheus-stack-kubelet
            patch: |-
              - op: test
                path: /spec/endpoints/1/path
                value: /metrics/cadvisor
              - op: test
                path: /spec/endpoints/2/path
                value: /metrics/probes
              - op: add
                path: /spec/endpoints/0/metricRelabelings/-
                value:
                  action: drop
                  sourceLabels: [__name__]
                  regex: (apiserver_delegated_(authn|authz)_request_duration_seconds|authentication_token_cache_request_duration_seconds|csi_operations_seconds|dra_operations_duration_seconds|kubelet_http_requests_duration_seconds|kubelet_image_pull_duration_seconds|kubelet_pod_start_(sli|total)_duration_seconds|kubelet_volume_metric_collection_duration_seconds|rest_client_(rate_limiter_duration_seconds|request_size_bytes|response_size_bytes)|volume_operation_total_seconds|workqueue_work_duration_seconds)_bucket
              - op: add
                path: /spec/endpoints/0/metricRelabelings/-
                value:
                  action: drop
                  sourceLabels: [__name__]
                  regex: kubernetes_feature_enabled
              # Redundant, static, or always-zero cadvisor series. CPU, memory
              # (working set/RSS/cache), throttling, PSI, OOM, network bytes
              # and block I/O stay.
              - op: add
                path: /spec/endpoints/1/metricRelabelings/-
                value:
                  action: drop
                  sourceLabels: [__name__]
                  regex: container_(memory_(failcnt|failures_total|kernel_usage|max_usage_bytes|usage_bytes|total_(active|inactive)_file_bytes)|network_(receive|transmit)_errors_total|threads|sockets|processes|start_time_seconds|last_seen|health_state|cpu_load_d_average_10s|ulimits_soft|cpu_cfs_burst_(periods|seconds)_total)
  values:
    alertmanager:
      enabled: true
      alertmanagerSpec:
        nodeSelector:
          kubernetes.io/hostname: ${PRIMARY_NODE_NAME}
        replicas: 1
        retention: 120h
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        containers:
          # The reloader's /metrics and file-watch bursts exceed a 50m quota
          # within one CFS period; the limit consumes no schedulable capacity.
          - name: config-reloader
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                cpu: 200m
                memory: 64Mi
        alertmanagerConfiguration:
          name: homelab-alerting
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: "null"
        receivers:
          - name: "null"

    prometheus:

      prometheusSpec:
        replicas: 1
        retention: 14d
        retentionSize: "8GB"
        walCompression: true
        scrapeInterval: 60s
        nodeSelector:
          kubernetes.io/hostname: ${PRIMARY_NODE_NAME}
        resources:
          requests:
            cpu: 62m
            memory: 500Mi
          limits:
            cpu: "1"
            memory: 1000Mi
        containers:
          # Same burst profile as the Alertmanager reloader.
          - name: config-reloader
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                cpu: 200m
                memory: 64Mi
        initContainers:
          - name: init-config-reloader
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                cpu: 50m
                memory: 64Mi
        securityContext:
          fsGroup: 2000
          runAsGroup: 2000
          runAsNonRoot: true
          runAsUser: 1000

        # Persist TSDB for advisor maturity + incident forensics, while keeping bounded retention.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 12Gi

        serviceMonitorSelectorNilUsesHelmValues: false
    grafana:
      enabled: true
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      envFromSecrets:
        - name: power-ledger-db
      additionalDataSources:
        - name: Power Cost Ledger
          uid: power-cost-ledger
          type: postgres
          access: proxy
          url: media-postgres.default.svc.cluster.local:5432
          user: power_ledger_reader
          editable: false
          jsonData:
            database: postgres
            sslmode: disable
            postgresVersion: 1600
            timescaledb: false
            maxOpenConns: 1
            maxIdleConns: 1
            connMaxLifetime: 14400
          secureJsonData:
            # Grafana expands this environment variable, not Flux.
            password: $POWER_LEDGER_PASSWORD
      initChownData:
        enabled: false

      persistence:
        enabled: true
        storageClassName: local-path
        size: 1Gi

      downloadDashboards:
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi

      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 768Mi

      # Each single-threaded sidecar process re-reads every labelled dashboard
      # whenever its 60s watch restarts; a one-core limit keeps that burst
      # out of CFS throttling.
      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: "1"
            memory: 128Mi

      # Only the chart's Grafana Overview dashboard reads Grafana's own
      # metrics. Keep its families and drop the other ~5.8k internal series.
      serviceMonitor:
        metricRelabelings:
          - action: keep
            sourceLabels: [__name__]
            regex: grafana_(alerting_result_total|build_info|stat_totals_dashboard|http_request_duration_seconds_(bucket|count|sum))|process_[a-z_]+|go_goroutines

      defaultDashboardsTimezone: browser

      ingress:
        enabled: true
        ingressClassName: nginx
        pathType: Prefix
        hosts:
          - monitoring.${BASE_DOMAIN}
          - grafana.${BASE_DOMAIN}
        annotations:
          external-dns.alpha.kubernetes.io/hostname: grafana.${BASE_DOMAIN}
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
          cert-manager.io/cluster-issuer: letsencrypt-prod
        tls:
          - secretName: grafana-tls
            hosts:
              - monitoring.${BASE_DOMAIN}
              - grafana.${BASE_DOMAIN}


      dashboards:

        default:
          node-exporter:
            gnetId: 1860
            revision: 37
            datasource: Prometheus
          kubernetes-pods:
            gnetId: 6417
            revision: 1
            datasource: Prometheus

    prometheusOperator:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 256Mi
      # No rule, dashboard, or repository query reads these resources'
      # families. Excluding the collectors also drops their watches.
      collectorsExclude:
        - certificatesigningrequests
        - configmaps
        - endpointslices
        - leases
        - limitranges
        - mutatingwebhookconfigurations
        - networkpolicies
        - replicationcontrollers
        - secrets
        - storageclasses
        - validatingwebhookconfigurations
        - volumeattachments
      # kube_replicaset_owner stays for the pod-owner recording rules. KSM
      # matches these regexes unanchored, so anchor them explicitly.
      metricDenylist:
        - ^kube_replicaset_(created|metadata_generation|spec_replicas|status_.+)$
        - ^kube_pod_(ips|restart_policy|scheduler|service_account|status_qos_class|tolerations)$

    kubelet:
      serviceMonitor:
        probesMetricRelabelings:
          - action: drop
            sourceLabels: [__name__]
            regex: prober_probe_duration_seconds_bucket

    nodeExporter:
      enabled: true

    prometheus-node-exporter:
      livenessProbe:
        failureThreshold: 6
        timeoutSeconds: 5
      readinessProbe:
        failureThreshold: 6
        timeoutSeconds: 5
      # The container-aware Go runtime runs node-exporter with GOMAXPROCS=1.
      # A scrape costs about 0.25 CPU-seconds, so any quota below one core
      # stretches it past a second and throttles most active CFS periods.
      resources:
        requests:
          cpu: 20m
          memory: 48Mi
        limits:
          cpu: "1"
          memory: 128Mi

    # Talos does not publish scheduler :10259, controller-manager :10257, or
    # kube-proxy :10249. These scrapes stay down and keep TargetDown plus the
    # InstanceUnreachable rules firing. Pod readiness is still covered by
    # control-plane-visibility.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    # Requests cannot fit on the utility node if the primary node is lost, so
    # these stock rules fire on a healthy two-node cluster. PrimaryNodeNotReady
    # is the failure that matters.
    defaultRules:
      disabled:
        KubeCPUOvercommit: true
        KubeMemoryOvercommit: true
