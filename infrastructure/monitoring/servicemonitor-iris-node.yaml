---
apiVersion: v1
kind: Service
metadata:
  name: iris-node
  namespace: monitoring
  labels:
    app.kubernetes.io/name: iris-node
spec:
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
# Keep the discovery role aligned with the existing Prometheus Endpoints discovery.
apiVersion: v1
kind: Endpoints
metadata:
  name: iris-node
  namespace: monitoring
subsets:
  - addresses:
      - ip: ${IRIS_MAC_MINI_IP}
    ports:
      - name: metrics
        port: 9100
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: iris-node
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames: [monitoring]
  selector:
    matchLabels:
      app.kubernetes.io/name: iris-node
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 10s
      relabelings:
        - targetLabel: host
          replacement: iris
