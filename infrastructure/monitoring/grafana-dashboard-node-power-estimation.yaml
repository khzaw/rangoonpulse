# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.32.0-standalone-strict/configmap-v1.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-node-power-estimation
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: node-power-estimation
data:
  node-power-estimation.json: |
    {
      "uid": "node-power-estimation",
      "title": "Node Power Estimation",
      "timezone": "Asia/Singapore",
      "schemaVersion": 41,
      "version": 5,
      "refresh": "1m",
      "tags": ["power", "homelab", "estimated", "hardware"],
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "refresh": 1
          },
          {
            "name": "node",
            "label": "Host (Kubernetes + Iris + TrueNAS)",
            "type": "query",
            "datasource": {
              "uid": "$datasource"
            },
            "query": {
              "query": "label_values(homelab:node_estimated_power_watts, node)",
              "refId": "NodeVariableQuery"
            },
            "multi": false,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": ".*"
            },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Model Notes",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "Kubernetes nodes use fixed idle/max CPU models. Iris uses fresh macmon software-reported system watts, without an added baseline. TrueNAS is an external TerraMaster/Celeron NAS: its existing API streams live CPU and disk counters to the Kubernetes exporter every two minutes. No extra NAS service or package is installed.\n\nThe uncalibrated TrueNAS model uses a 12 W platform/RAM/NVMe/USB allowance, up to 10 W additional CPU load, and per-drive idle/active allowances: ST8000VN004 8/10 W, ST8000NT001 8/10 W, ST8000VN002 4/6 W. Disk busy-time fractions interpolate each drive's allowance. The 32–48 W modeled envelope is not a measured minimum/maximum; spin-up, PSU losses and temperature effects are not captured accurately.\n\nAll hosts includes Kubernetes nodes, Iris and TrueNAS. Kubernetes cluster totals exclude both external hosts. Valid current scrapes and fresh samples are required (Iris ≤90 s; TrueNAS ≤180 s). Missing or warming-up telemetry leaves gaps, never zero/idle watts. NAS boot/counter changes and outages establish a new two-poll baseline automatically.\n\nEnergy and cost integrate recorded two-minute samples without filling gaps. Each host joins only from its enrollment boundary; old costs/checkpoints remain unchanged. Iris enrollment remains 28 October 2026 at 16:30 SGT. The TrueNAS enrollment panel shows its effective boundary. Cost uses the GST-inclusive Singapore tariff effective at each evaluation; quarterly changes do not reprice history. Monthly totals are saved snapshots, not live projections. Raspberry Pi low-voltage panels are hardware alarms, separate from estimated consumption."
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Selected Scope Estimated Power",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "sum(homelab:node_estimated_power_watts{node=~\"$node\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 1
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Selected Scope Estimated Energy",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "sum(sum_over_time(homelab:node_estimated_power_watts{node=~\"$node\"}[$__range])) * 120 / 3600000",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "kWh",
              "decimals": 2
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Selected Scope Estimated Cost",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "sum(sum_over_time(homelab:node_estimated_cost_sgd_per_hour{node=~\"$node\"}[$__range])) * 120 / 3600",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "prefix:S$",
              "decimals": 2
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Kubernetes Cluster Estimated Power",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "homelab:cluster_estimated_power_watts",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 1
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Homelab Estimated Energy",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "sum(sum_over_time(homelab:node_estimated_power_watts[$__range])) * 120 / 3600000",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "kWh",
              "decimals": 2
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Homelab Estimated Cost",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "sum(sum_over_time(homelab:node_estimated_cost_sgd_per_hour[$__range])) * 120 / 3600",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "prefix:S$",
              "decimals": 2
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Singapore Tariff (SGD/kWh, GST inclusive)",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "max(homelab:singapore_household_tariff_sgd_per_kwh)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "prefix:S$",
              "decimals": 4
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Selected Scope CPU Utilization (Model Input)",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 6,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "avg(homelab:node_power_model_cpu_utilization:ratio{node=~\"$node\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Estimated Power by Host",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "homelab:node_estimated_power_watts{node=~\"$node\"}",
              "legendFormat": "{{node}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 1
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "CPU Utilization by Host (Model Input)",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "homelab:node_power_model_cpu_utilization:ratio{node=~\"$node\"}",
              "legendFormat": "{{node}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2
            }
          }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Utility Node Low-Voltage Alarm",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 29
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "max(homelab:node_rpi_low_voltage_alarm{node=\"${UTILITY_NODE_NAME}\"}) or on() vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Clear",
                      "color": "green"
                    },
                    "1": {
                      "text": "Low Voltage",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Utility Node Low-Voltage Seen In Range",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 29
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "max(max_over_time(homelab:node_rpi_low_voltage_alarm{node=\"${UTILITY_NODE_NAME}\"}[$__range])) or on() vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Not Seen",
                      "color": "green"
                    },
                    "1": {
                      "text": "Seen",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Utility Node Low-Voltage Alarm History",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 16,
            "x": 8,
            "y": 29
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "homelab:node_rpi_low_voltage_alarm{node=\"${UTILITY_NODE_NAME}\"}",
              "legendFormat": "low-voltage alarm"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 15,
          "type": "stat",
          "title": "Tariff Status",
          "datasource": {"uid": "$datasource"},
          "gridPos": {"h": 4, "w": 8, "x": 0, "y": 33},
          "targets": [{
            "refId": "A",
            "expr": "max(vector(time()) >= bool on() homelab:singapore_household_tariff_valid_until_seconds)",
            "instant": true
          }],
          "fieldConfig": {"defaults": {
            "mappings": [{"type": "value", "options": {
              "0": {"text": "Current", "color": "green"},
              "1": {"text": "Expired — last known rate", "color": "red"}
            }}],
            "noValue": "Tariff missing",
            "thresholds": {"mode": "absolute", "steps": [
              {"color": "green", "value": null},
              {"color": "red", "value": 1}
            ]}
          }},
          "options": {
            "colorMode": "background",
            "reduceOptions": {"calcs": ["lastNotNull"], "values": false}
          }
        },
        {
          "id": 16,
          "type": "stat",
          "title": "Current Month — Recorded Homelab Cost",
          "description": "Durable monthly total, updated on Mondays and the first of each month. Not a live projection. Partial coverage is shown in the monthly table; this panel ignores the dashboard time picker.",
          "datasource": {"type": "postgres", "uid": "power-cost-ledger"},
          "gridPos": {"h": 5, "w": 8, "x": 0, "y": 37},
          "targets": [{
            "refId": "A", "format": "table", "rawQuery": true,
            "rawSql": "SELECT cost_sgd::double precision AS \"Recorded SGD\" FROM power_estimation.monthly_cost WHERE month = date_trunc('month', now() AT TIME ZONE 'Asia/Singapore')::date"
          }],
          "fieldConfig": {"defaults": {"unit": "prefix:S$", "decimals": 4, "noValue": "Awaiting collection"}},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "id": 17,
          "type": "barchart",
          "title": "Monthly Homelab Electricity Cost",
          "description": "Saved monthly estimates in SGD, independent of Prometheus retention and the dashboard time picker. Iris is included only from 28 October 2026 at 16:30 SGT; earlier totals remain cluster-only. Current month is provisional; consult the table for partial coverage and collection time. No data is invented for missing periods. TrueNAS contributes only from its own enrollment boundary; earlier costs and coverage are preserved.",
          "datasource": {"type": "postgres", "uid": "power-cost-ledger"},
          "gridPos": {"h": 8, "w": 16, "x": 8, "y": 33},
          "targets": [{
            "refId": "A", "format": "table", "rawQuery": true,
            "rawSql": "SELECT to_char(month, 'YYYY-MM') AS \"Month\", cost_sgd::double precision AS \"Estimated cost\" FROM power_estimation.monthly_cost ORDER BY month"
          }],
          "fieldConfig": {"defaults": {"unit": "prefix:S$", "decimals": 4, "min": 0}},
          "options": {"orientation": "vertical", "xField": "Month", "showValue": "auto", "legend": {"showLegend": false}, "tooltip": {"mode": "single"}}
        },
        {
          "id": 18,
          "type": "table",
          "title": "Saved Monthly Totals & Coverage",
          "description": "One homelab-total row per Singapore month. Iris joins at enrollment (28 October 2026, 16:30 SGT); earlier totals and their coverage are unchanged. Final means collection passed month-end; partial means measurements are missing, including the first month's unrecorded prefix. Weekly job checkpoints and totals commit together. No per-node or daily ledger is retained. TrueNAS contributes only from its own enrollment boundary; earlier costs and coverage are preserved.",
          "datasource": {"type": "postgres", "uid": "power-cost-ledger"},
          "gridPos": {"h": 7, "w": 24, "x": 0, "y": 82},
          "targets": [{
            "refId": "A", "format": "table", "rawQuery": true,
            "rawSql": "SELECT to_char(month, 'YYYY-MM') AS \"Month\", cost_sgd::double precision AS \"Cost (SGD)\", round(100.0 * observed_samples / nullif(expected_samples, 0), 2)::double precision AS \"Coverage (%)\", CASE WHEN collected_until >= (month::timestamp + interval '1 month') AT TIME ZONE 'Asia/Singapore' THEN 'Final' ELSE 'In progress' END || CASE WHEN observed_samples < expected_samples THEN ' · partial coverage' ELSE '' END AS \"Status\", collected_until AS \"Collected through\" FROM power_estimation.monthly_cost ORDER BY month DESC"
          }],
          "fieldConfig": {"defaults": {"decimals": 4}, "overrides": [
            {"matcher": {"id": "byName", "options": "Collected through"}, "properties": [{"id": "unit", "value": "dateTimeAsIso"}]},
            {"matcher": {"id": "byName", "options": "Coverage (%)"}, "properties": [{"id": "decimals", "value": 2}]}
          ]},
          "options": {"showHeader": true}
        },
        {
          "id": 19,
          "type": "stat",
          "title": "TrueNAS Telemetry",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 89
          },
          "targets": [
            {
              "refId": "A",
              "expr": "homelab:truenas_power_sample_available",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Unavailable",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Unavailable / warming up",
                      "color": "orange"
                    },
                    "1": {
                      "text": "Live",
                      "color": "green"
                    }
                  }
                }
              ]
            }
          },
          "options": {
            "colorMode": "background",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "id": 20,
          "type": "stat",
          "title": "TrueNAS Sample Age",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 89
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max((time() - truenas_power_sample_timestamp_seconds) and homelab:truenas_power_input_watts)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0,
              "noValue": "Unavailable"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "TrueNAS Estimated Power Components",
          "description": "Uncalibrated software model, not hardware watt sensors. Gaps mean unavailable telemetry. Fixed platform includes RAM, fans, NVMe and USB boot allowance; HDDs remain spinning.",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 8,
            "y": 89
          },
          "targets": [
            {
              "refId": "A",
              "expr": "truenas_power_platform_watts and homelab:truenas_power_input_watts",
              "legendFormat": "Platform / RAM / NVMe / USB"
            },
            {
              "refId": "B",
              "expr": "truenas_power_cpu_dynamic_watts and homelab:truenas_power_input_watts",
              "legendFormat": "Additional CPU load"
            },
            {
              "refId": "C",
              "expr": "truenas_power_disks_estimated_watts and homelab:truenas_power_input_watts",
              "legendFormat": "Spinning HDDs"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 1,
              "custom": {
                "fillOpacity": 35,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            }
          }
        },
        {
          "id": 22,
          "type": "stat",
          "title": "TrueNAS Cost Enrollment",
          "description": "The NAS is never backfilled into earlier power or monthly ledger history.",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 53
          },
          "targets": [
            {
              "refId": "A",
              "expr": "vector(${TRUENAS_POWER_COST_START_SECONDS} * 1000)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dateTimeAsIso",
              "noValue": "Unavailable"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        }
      ]
    }
