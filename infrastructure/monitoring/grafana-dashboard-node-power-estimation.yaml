# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.32.0-standalone-strict/configmap-v1.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-node-power-estimation
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: node-power-estimation
data:
  node-power-estimation.json: |
    {
      "uid": "node-power-estimation",
      "title": "Node Power Estimation",
      "timezone": "Asia/Singapore",
      "schemaVersion": 41,
      "version": 4,
      "refresh": "1m",
      "tags": ["power", "homelab", "estimated", "hardware"],
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "refresh": 1
          },
          {
            "name": "node",
            "label": "Host (Kubernetes nodes + Iris)",
            "type": "query",
            "datasource": {
              "uid": "$datasource"
            },
            "query": {
              "query": "label_values(homelab:node_estimated_power_watts, node)",
              "refId": "NodeVariableQuery"
            },
            "multi": false,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": ".*"
            },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Model Notes",
          "gridPos": {
            "h": 4,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "Estimated host watts use fixed idle/max constants plus CPU utilization. Kubernetes nodes prefer whole-host kubelet CPU with a container-CPU fallback. Iris is an external M4 Mac mini, not a Kubernetes node: its native exporter supplies CPU load with a 4 W idle / 65 W maximum model based on Apple's M4 reference configuration (not a measurement of this 24 GB Mac). CPU load misses GPU/Neural Engine and peripheral variation. All hosts includes the two Kubernetes nodes plus Iris; Kubernetes cluster totals exclude Iris. Missing Iris telemetry is unavailable, not zero watts. Iris cost enrollment starts 28 October 2026 at 16:30 SGT; older monthly totals remain cluster-only. Energy and cost stats integrate recorded 2-minute samples in the active Grafana time range, without extrapolating Iris into the time before enrollment. Cost integrates recorded cost/hour samples using the GST-inclusive Singapore tariff effective at each evaluation. Tariffs are checked daily through GitOps and switch at Singapore midnight. Cost history begins when cost recording was deployed; older data is not backfilled, and missing samples are not extrapolated. A stale tariff remains in use and fires SingaporePowerTariffStale; the tariff-status panel turns red after expiry. The utility-node Raspberry Pi now also exposes a live low-voltage alarm from hardware telemetry so power trouble is visible before workloads crash."
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Selected Scope Estimated Power",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "sum(homelab:node_estimated_power_watts{node=~\"$node\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 1
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Selected Scope Estimated Energy",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "sum(sum_over_time(homelab:node_estimated_power_watts{node=~\"$node\"}[$__range])) * 120 / 3600000",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "kWh",
              "decimals": 2
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Selected Scope Estimated Cost",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "sum(sum_over_time(homelab:node_estimated_cost_sgd_per_hour{node=~\"$node\"}[$__range])) * 120 / 3600",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "prefix:S$",
              "decimals": 2
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Kubernetes Cluster Estimated Power",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "homelab:cluster_estimated_power_watts",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 1
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Homelab Estimated Energy",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "sum(sum_over_time(homelab:node_estimated_power_watts[$__range])) * 120 / 3600000",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "kWh",
              "decimals": 2
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Homelab Estimated Cost",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "sum(sum_over_time(homelab:node_estimated_cost_sgd_per_hour[$__range])) * 120 / 3600",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "prefix:S$",
              "decimals": 2
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Singapore Tariff (SGD/kWh, GST inclusive)",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "max(homelab:singapore_household_tariff_sgd_per_kwh)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "prefix:S$",
              "decimals": 4
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Selected Scope CPU Utilization (Model Input)",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 6,
            "y": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "avg(homelab:node_power_model_cpu_utilization:ratio{node=~\"$node\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Estimated Power by Node",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "homelab:node_estimated_power_watts{node=~\"$node\"}",
              "legendFormat": "{{node}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 1
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "CPU Utilization by Node (Model Input)",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "homelab:node_power_model_cpu_utilization:ratio{node=~\"$node\"}",
              "legendFormat": "{{node}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2
            }
          }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Utility Node Low-Voltage Alarm",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 25
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "max(homelab:node_rpi_low_voltage_alarm{node=\"${UTILITY_NODE_NAME}\"}) or on() vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Clear",
                      "color": "green"
                    },
                    "1": {
                      "text": "Low Voltage",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Utility Node Low-Voltage Seen In Range",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 25
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "max(max_over_time(homelab:node_rpi_low_voltage_alarm{node=\"${UTILITY_NODE_NAME}\"}[$__range])) or on() vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Not Seen",
                      "color": "green"
                    },
                    "1": {
                      "text": "Seen",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Utility Node Low-Voltage Alarm History",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 4,
            "w": 16,
            "x": 8,
            "y": 25
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "uid": "$datasource"
              },
              "expr": "homelab:node_rpi_low_voltage_alarm{node=\"${UTILITY_NODE_NAME}\"}",
              "legendFormat": "low-voltage alarm"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 15,
          "type": "stat",
          "title": "Tariff Status",
          "datasource": {"uid": "$datasource"},
          "gridPos": {"h": 4, "w": 8, "x": 0, "y": 29},
          "targets": [{
            "refId": "A",
            "expr": "max(vector(time()) >= bool on() homelab:singapore_household_tariff_valid_until_seconds)",
            "instant": true
          }],
          "fieldConfig": {"defaults": {
            "mappings": [{"type": "value", "options": {
              "0": {"text": "Current", "color": "green"},
              "1": {"text": "Expired — last known rate", "color": "red"}
            }}],
            "noValue": "Tariff missing",
            "thresholds": {"mode": "absolute", "steps": [
              {"color": "green", "value": null},
              {"color": "red", "value": 1}
            ]}
          }},
          "options": {
            "colorMode": "background",
            "reduceOptions": {"calcs": ["lastNotNull"], "values": false}
          }
        },
        {
          "id": 16,
          "type": "stat",
          "title": "Current Month — Recorded Homelab Cost",
          "description": "Durable monthly total, updated on Mondays and the first of each month. Not a live projection. Partial coverage is shown in the monthly table; this panel ignores the dashboard time picker.",
          "datasource": {"type": "postgres", "uid": "power-cost-ledger"},
          "gridPos": {"h": 5, "w": 8, "x": 0, "y": 33},
          "targets": [{
            "refId": "A", "format": "table", "rawQuery": true,
            "rawSql": "SELECT cost_sgd::double precision AS \"Recorded SGD\" FROM power_estimation.monthly_cost WHERE month = date_trunc('month', now() AT TIME ZONE 'Asia/Singapore')::date"
          }],
          "fieldConfig": {"defaults": {"unit": "prefix:S$", "decimals": 4, "noValue": "Awaiting collection"}},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "id": 17,
          "type": "barchart",
          "title": "Monthly Homelab Electricity Cost",
          "description": "Saved monthly estimates in SGD, independent of Prometheus retention and the dashboard time picker. Iris is included only from 28 October 2026 at 16:30 SGT; earlier totals remain cluster-only. Current month is provisional; consult the table for partial coverage and collection time. No data is invented for missing periods.",
          "datasource": {"type": "postgres", "uid": "power-cost-ledger"},
          "gridPos": {"h": 8, "w": 16, "x": 8, "y": 29},
          "targets": [{
            "refId": "A", "format": "table", "rawQuery": true,
            "rawSql": "SELECT to_char(month, 'YYYY-MM') AS \"Month\", cost_sgd::double precision AS \"Estimated cost\" FROM power_estimation.monthly_cost ORDER BY month"
          }],
          "fieldConfig": {"defaults": {"unit": "prefix:S$", "decimals": 4, "min": 0}},
          "options": {"orientation": "vertical", "xField": "Month", "showValue": "auto", "legend": {"showLegend": false}, "tooltip": {"mode": "single"}}
        },
        {
          "id": 18,
          "type": "table",
          "title": "Saved Monthly Totals & Coverage",
          "description": "One homelab-total row per Singapore month. Iris joins at enrollment (28 October 2026, 16:30 SGT); earlier totals and their coverage are unchanged. Final means collection passed month-end; partial means measurements are missing, including the first month's unrecorded prefix. Weekly job checkpoints and totals commit together. No per-node or daily ledger is retained.",
          "datasource": {"type": "postgres", "uid": "power-cost-ledger"},
          "gridPos": {"h": 7, "w": 24, "x": 0, "y": 38},
          "targets": [{
            "refId": "A", "format": "table", "rawQuery": true,
            "rawSql": "SELECT to_char(month, 'YYYY-MM') AS \"Month\", cost_sgd::double precision AS \"Cost (SGD)\", round(100.0 * observed_samples / nullif(expected_samples, 0), 2)::double precision AS \"Coverage (%)\", CASE WHEN collected_until >= (month::timestamp + interval '1 month') AT TIME ZONE 'Asia/Singapore' THEN 'Final' ELSE 'In progress' END || CASE WHEN observed_samples < expected_samples THEN ' · partial coverage' ELSE '' END AS \"Status\", collected_until AS \"Collected through\" FROM power_estimation.monthly_cost ORDER BY month DESC"
          }],
          "fieldConfig": {"defaults": {"decimals": 4}, "overrides": [
            {"matcher": {"id": "byName", "options": "Collected through"}, "properties": [{"id": "unit", "value": "dateTimeAsIso"}]},
            {"matcher": {"id": "byName", "options": "Coverage (%)"}, "properties": [{"id": "decimals", "value": 2}]}
          ]},
          "options": {"showHeader": true}
        }
      ]
    }
