# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.32.0-standalone-strict/all.json
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-power-estimation
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: node-power-estimation.rules
      interval: 2m
      rules:
        - record: homelab:node_cpu_usage_cores:rate5m
          expr: >
            sum by (node) (
              rate(
                container_cpu_usage_seconds_total{
                  job="kubelet",
                  metrics_path="/metrics/cadvisor",
                  image!="",
                  container!="",
                  container!="POD"
                }[5m]
              )
            )

        - record: homelab:node_cpu_utilization:ratio
          expr: >
            clamp_min(
              clamp_max(
                homelab:node_cpu_usage_cores:rate5m
                / on(node) machine_cpu_cores{job="kubelet",metrics_path="/metrics/cadvisor"},
                1
              ),
              0
            )

        # Iris is an external Darwin host, not a Kubernetes node. Suppress stale
        # CPU rates when its exporter is down; missing telemetry is not idle power.
        - record: homelab:iris_cpu_utilization:ratio
          expr: >
            clamp_min(clamp_max(
              1 - avg(
                rate(node_cpu_seconds_total{job="iris-node",host="iris",mode="idle"}[5m])
                and on(instance) (up{job="iris-node"} == 1)
              ), 1), 0)
            and on() (vector(time()) >= ${IRIS_POWER_COST_START_SECONDS})
          labels:
            node: iris

        # Prefer whole-host CPU utilization from kubelet /metrics/resource when present.
        # Fall back to container-only utilization if the host-level series is absent.
        - record: homelab:node_power_model_cpu_utilization:ratio
          expr: >
            homelab:node_host_cpu_utilization:ratio
            or
            homelab:node_cpu_utilization:ratio
            or
            homelab:iris_cpu_utilization:ratio

        # Tune these constants when hardware or node roles change.
        - record: homelab:node_idle_power_watts
          expr: >
            max by (node) (0 * kube_node_info{node="${PRIMARY_NODE_NAME}"} + 20)
            or
            max by (node) (0 * kube_node_info{node="${UTILITY_NODE_NAME}"} + 4)
            or
            (0 * homelab:iris_cpu_utilization:ratio + 4)

        - record: homelab:node_max_power_watts
          expr: >
            max by (node) (0 * kube_node_info{node="${PRIMARY_NODE_NAME}"} + 75)
            or
            max by (node) (0 * kube_node_info{node="${UTILITY_NODE_NAME}"} + 12)
            or
            (0 * homelab:iris_cpu_utilization:ratio + 65)

        - record: homelab:node_estimated_power_watts
          expr: >
            homelab:node_idle_power_watts
            + (
              (homelab:node_max_power_watts - homelab:node_idle_power_watts)
              * on(node) homelab:node_power_model_cpu_utilization:ratio
            )

        # Surface Raspberry Pi low-voltage alarms from node-exporter hwmon.
        - record: homelab:node_rpi_low_voltage_alarm
          expr: >
            max by (node) (
              label_replace(
                max by (instance, nodename) (
                  (
                    node_hwmon_in_lcrit_alarm_volts
                    * on(instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{chip_name="rpi_volt"}
                  )
                  * on(instance) group_left(nodename)
                  node_uname_info
                ),
                "node", "$1", "nodename", "(.*)"
              )
            )

        # Keep scheduler-node totals separate from all monitored power-model hosts.
        - record: homelab:cluster_estimated_power_watts
          expr: sum(homelab:node_estimated_power_watts and on(node) kube_node_info)

        - record: homelab:estimated_power_watts
          expr: sum(homelab:node_estimated_power_watts)

        # BEGIN GENERATED TARIFFS
        # SGD/kWh, GST inclusive; Singapore midnight boundaries. See power-tariffs.json.
        - record: homelab:singapore_household_tariff_sgd_per_kwh
          expr: >
            ((vector(0.3478) and on() (vector(time()) >= 1782835200)) and on() (vector(time()) < 1790784000))
            or (vector(0.3116) and on() (vector(time()) >= 1790784000))
        - record: homelab:singapore_household_tariff_valid_until_seconds
          expr: >
            ((vector(1790784000) and on() (vector(time()) >= 1782835200)) and on() (vector(time()) < 1790784000))
            or (vector(1798732800) and on() (vector(time()) >= 1790784000))
        # END GENERATED TARIFFS

        # Same-group ordering records the tariff applicable at each evaluation.
        - record: homelab:node_estimated_cost_sgd_per_hour
          expr: homelab:node_estimated_power_watts / 1000 * scalar(homelab:singapore_household_tariff_sgd_per_kwh)

        - alert: SingaporePowerTariffStale
          expr: time() >= homelab:singapore_household_tariff_valid_until_seconds
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Singapore electricity tariff has expired
            description: The last known rate is still being used. Check the Power tariff update GitHub Action and approve its PR or repair the official-source parser.

        - alert: SingaporePowerTariffMissing
          expr: absent(homelab:singapore_household_tariff_sgd_per_kwh) or absent(homelab:singapore_household_tariff_valid_until_seconds)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Singapore electricity tariff metrics are missing
            description: Check the node-power-estimation Prometheus rules before trusting cost estimates.
