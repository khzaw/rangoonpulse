# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.32.0-standalone-strict/all.json
---
# Scrapes the Flux Operator, which exports flux_resource_info{kind,name,ready,
# suspended,reason,revision} for every Flux object in the cluster. This is the
# source for the Flux reconciliation alerts in prometheusrule-flux-reconciliation.yaml.
# The flux-system allow-scraping NetworkPolicy already permits 8080 from any namespace.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flux-operator
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
