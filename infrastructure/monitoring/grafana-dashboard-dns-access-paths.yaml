# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.32.0-standalone-strict/configmap-v1.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-dns-access-paths
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: dns-access-paths
data:
  dns-access-paths.json: |
    {
      "uid": "dns-access-paths",
      "title": "DNS and Access Paths",
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 2,
      "refresh": "1m",
      "tags": ["dns", "adguard", "tailscale", "access", "ingress", "homelab"],
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "refresh": 1
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "uid": "$datasource"
            },
            "query": {
              "query": "label_values(kube_ingress_info, namespace)",
              "refId": "NamespaceVariableQuery"
            },
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": ".*"
            },
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "ingressclass",
            "label": "Ingress Class",
            "type": "query",
            "datasource": {
              "uid": "$datasource"
            },
            "query": {
              "query": "label_values(kube_ingress_info{namespace=~\"$namespace\"}, ingressclass)",
              "refId": "IngressClassVariableQuery"
            },
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": ".*"
            },
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "host",
            "label": "Host",
            "type": "query",
            "datasource": {
              "uid": "$datasource"
            },
            "query": {
              "query": "label_values(kube_ingress_path{namespace=~\"$namespace\"}, host)",
              "refId": "HostVariableQuery"
            },
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": ".*"
            },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Focus",
          "gridPos": {
            "h": 4,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "AdGuard DNS checks and independent router placement appear first; CoreDNS and ingress/TLS inventory follow. Gatus probes private DNS records from inside the cluster and runs on the Pi. Router readiness does not prove tunnel health or approved routes. Remote-client DNS and full-node failover require a separate client-path check."
          }
        },
        {
          "id": 16,
          "type": "row",
          "title": "AdGuard and Tailscale DNS routing",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 17,
          "title": "AdGuard Primary DNS",
          "type": "stat",
          "description": "Gatus queries the private gatus.${BASE_DOMAIN} A record through this DNS VIP every 60 seconds. Does not test public upstreams or Tailscale routing. Missing/failed Gatus scrape is UNKNOWN.",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(gatus_results_endpoint_success{job=\"gatus\",group=\"DNS\",name=\"AdGuard Primary DNS\"} and on(job,instance) (up{job=\"gatus\"} == 1))",
              "datasource": {
                "uid": "$datasource"
              },
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "UNKNOWN",
              "min": 0,
              "max": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  }
                }
              ]
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 19,
          "title": "Pi Router Ready",
          "type": "stat",
          "description": "Pod readiness on a Ready Kubernetes node. This does not test the Tailscale tunnel, route approval, or remote DNS path. Missing kube-state-metrics telemetry is UNKNOWN.",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 8,
            "y": 5,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "((max(max by(namespace,pod,node,pod_ip) (kube_pod_info{namespace=\"tailscale\",pod=~\"ts-homelab-subnet-router-.+\"}) * on(namespace,pod) group_left() max by(namespace,pod) (kube_pod_status_ready{namespace=\"tailscale\",pod=~\"ts-homelab-subnet-router-.+\",condition=\"true\"}) * on(node) group_left() max by(node) (kube_node_status_condition{condition=\"Ready\",status=\"true\"}))) or vector(0)) and on() (max(up{job=\"kube-state-metrics\"}) == 1)",
              "datasource": {
                "uid": "$datasource"
              },
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "UNKNOWN",
              "min": 0,
              "max": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  }
                }
              ]
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 18,
          "title": "AdGuard Secondary DNS",
          "type": "stat",
          "description": "Gatus queries the private gatus.${BASE_DOMAIN} A record through this DNS VIP every 60 seconds. Does not test public upstreams or Tailscale routing. Missing/failed Gatus scrape is UNKNOWN.",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 4,
            "y": 5,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(gatus_results_endpoint_success{job=\"gatus\",group=\"DNS\",name=\"AdGuard Secondary DNS\"} and on(job,instance) (up{job=\"gatus\"} == 1))",
              "datasource": {
                "uid": "$datasource"
              },
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "UNKNOWN",
              "min": 0,
              "max": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  }
                }
              ]
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 20,
          "title": "Main Router Ready",
          "type": "stat",
          "description": "Pod readiness on a Ready Kubernetes node. This does not test the Tailscale tunnel, route approval, or remote DNS path. Missing kube-state-metrics telemetry is UNKNOWN.",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "((max(max by(namespace,pod,node,pod_ip) (kube_pod_info{namespace=\"tailscale\",pod=~\"ts-homelab-dns-backup-.+\"}) * on(namespace,pod) group_left() max by(namespace,pod) (kube_pod_status_ready{namespace=\"tailscale\",pod=~\"ts-homelab-dns-backup-.+\",condition=\"true\"}) * on(node) group_left() max by(node) (kube_node_status_condition{condition=\"Ready\",status=\"true\"}))) or vector(0)) and on() (max(up{job=\"kube-state-metrics\"}) == 1)",
              "datasource": {
                "uid": "$datasource"
              },
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "UNKNOWN",
              "min": 0,
              "max": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  }
                }
              ]
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 21,
          "title": "Ready Router Nodes / 2",
          "type": "stat",
          "description": "Distinct Ready nodes with a Ready DNS router pod. Expected: 2. Pod readiness on a Ready Kubernetes node. This does not test the Tailscale tunnel, route approval, or remote DNS path. Missing kube-state-metrics telemetry is UNKNOWN.",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 16,
            "y": 5,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "((count(count by(node) ((max by(namespace,pod,node,pod_ip) (kube_pod_info{namespace=\"tailscale\",pod=~\"ts-homelab-(subnet-router|dns-backup)-.+\"}) * on(namespace,pod) group_left() max by(namespace,pod) (kube_pod_status_ready{namespace=\"tailscale\",pod=~\"ts-homelab-(subnet-router|dns-backup)-.+\",condition=\"true\"}) * on(node) group_left() max by(node) (kube_node_status_condition{condition=\"Ready\",status=\"true\"})) == 1))) or vector(0)) and on() (max(up{job=\"kube-state-metrics\"}) == 1)",
              "datasource": {
                "uid": "$datasource"
              },
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "UNKNOWN",
              "min": 0,
              "max": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 22,
          "title": "Gatus Scrape",
          "type": "stat",
          "description": "Availability of the DNS probe collector. Gatus runs on the Pi, so Pi loss also removes these DNS checks. Router telemetry comes independently from kube-state-metrics.",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 20,
            "y": 5,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(up{job=\"gatus\"})",
              "datasource": {
                "uid": "$datasource"
              },
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "UNKNOWN",
              "min": 0,
              "max": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  }
                }
              ]
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 23,
          "title": "AdGuard Private DNS Check Latency",
          "type": "timeseries",
          "description": "Observed Gatus private-record DNS check duration; not upstream recursion latency. Gaps indicate missing collector telemetry.",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by(name) (gatus_results_duration_seconds{job=\"gatus\",group=\"DNS\",name=~\"AdGuard (Primary|Secondary) DNS\"} and on(job,instance) (up{job=\"gatus\"} == 1))",
              "datasource": {
                "uid": "$datasource"
              },
              "legendFormat": "{{name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "spanNulls": false
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "id": 24,
          "title": "DNS Router Readiness by Node",
          "type": "timeseries",
          "description": "Pod readiness on a Ready Kubernetes node. This does not test the Tailscale tunnel, route approval, or remote DNS path. Missing kube-state-metrics telemetry is UNKNOWN.",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 12,
            "y": 10,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(max by(namespace,pod,node,pod_ip) (kube_pod_info{namespace=\"tailscale\",pod=~\"ts-homelab-(subnet-router|dns-backup)-.+\"}) * on(namespace,pod) group_left() max by(namespace,pod) (kube_pod_status_ready{namespace=\"tailscale\",pod=~\"ts-homelab-(subnet-router|dns-backup)-.+\",condition=\"true\"}) * on(node) group_left() max by(node) (kube_node_status_condition{condition=\"Ready\",status=\"true\"})) and on() (max(up{job=\"kube-state-metrics\"}) == 1)",
              "datasource": {
                "uid": "$datasource"
              },
              "legendFormat": "{{pod}} \u00b7 {{node}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bool",
              "min": 0,
              "custom": {
                "spanNulls": false
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "id": 25,
          "title": "DNS Router CPU Usage",
          "type": "timeseries",
          "description": "Existing kubelet cAdvisor metrics for the router container on each node.",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(pod,node) (rate(container_cpu_usage_seconds_total{job=\"kubelet\",metrics_path=\"/metrics/cadvisor\",namespace=\"tailscale\",pod=~\"ts-homelab-(subnet-router|dns-backup)-.+\",container=\"tailscale\"}[5m]))",
              "datasource": {
                "uid": "$datasource"
              },
              "legendFormat": "{{pod}} \u00b7 {{node}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "min": 0,
              "custom": {
                "spanNulls": false
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "id": 26,
          "title": "DNS Router Memory",
          "type": "timeseries",
          "description": "Existing kubelet cAdvisor metrics for the router container on each node.",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 8,
            "y": 18,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(pod,node) (container_memory_working_set_bytes{job=\"kubelet\",metrics_path=\"/metrics/cadvisor\",namespace=\"tailscale\",pod=~\"ts-homelab-(subnet-router|dns-backup)-.+\",container=\"tailscale\"})",
              "datasource": {
                "uid": "$datasource"
              },
              "legendFormat": "{{pod}} \u00b7 {{node}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "spanNulls": false
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "id": 27,
          "title": "DNS Router Placement",
          "type": "table",
          "description": "Pod readiness on a Ready Kubernetes node. This does not test the Tailscale tunnel, route approval, or remote DNS path. Missing kube-state-metrics telemetry is UNKNOWN.",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "x": 16,
            "y": 18,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(max by(namespace,pod,node,pod_ip) (kube_pod_info{namespace=\"tailscale\",pod=~\"ts-homelab-(subnet-router|dns-backup)-.+\"}) * on(namespace,pod) group_left() max by(namespace,pod) (kube_pod_status_ready{namespace=\"tailscale\",pod=~\"ts-homelab-(subnet-router|dns-backup)-.+\",condition=\"true\"}) * on(node) group_left() max by(node) (kube_node_status_condition{condition=\"Ready\",status=\"true\"})) and on() (max(up{job=\"kube-state-metrics\"}) == 1)",
              "datasource": {
                "uid": "$datasource"
              },
              "instant": true,
              "format": "table"
            }
          ],
          "options": {
            "showHeader": true
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "namespace": true
                },
                "renameByName": {
                  "pod": "Router pod",
                  "node": "Node",
                  "pod_ip": "Pod IP",
                  "Value": "Ready"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Ready"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bool"
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 28,
          "type": "row",
          "title": "CoreDNS and access inventory",
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "CoreDNS Targets Down",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 27
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up{job=\"coredns\"} == 0)",
              "instant": true,
              "datasource": {
                "uid": "$datasource"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "DNS Requests / s",
          "datasource": {
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 27
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(coredns_dns_requests_total[5m]))",
              "instant": true,
              "datasource": {
                "uid": "$datasource"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "SERVFAIL / s",
