# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  interval: 24h
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "11.20.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    releaseLabel: false

    nodeSelector:
      kubernetes.io/hostname: ${PRIMARY_NODE_NAME}

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

    config:
      modules:
        iris_health_http:
          prober: http
          timeout: 5s
          http:
            preferred_ip_protocol: ip4
            valid_status_codes: [200]
            fail_if_body_not_matches_regexp:
              - '"ok"\s*:\s*true'
        truenas_ui_http:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: true
            preferred_ip_protocol: ip4
        truenas_api_http:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: false
            preferred_ip_protocol: ip4
            valid_status_codes:
              - 401
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4

    serviceMonitor:
      enabled: true
      defaults:
        labels:
          release: kube-prometheus-stack
        interval: 60s
        scrapeTimeout: 10s
      targets:
        - name: iris-gateway
          url: http://${IRIS_MAC_MINI_IP}:18789/healthz
          module: iris_health_http
        - name: iris-readiness
          url: http://${IRIS_MAC_MINI_IP}:9101/healthz/openclaw
          module: iris_health_http
        - name: iris-hermes-gateway
          url: http://${IRIS_MAC_MINI_IP}:9101/healthz/hermes-gateway
          module: iris_health_http
        - name: iris-hermes-dashboard
          url: http://${IRIS_MAC_MINI_IP}:9119/api/health
          module: iris_health_http
        - name: iris-hermes-readiness
          url: http://${IRIS_MAC_MINI_IP}:9101/healthz/hermes
          module: iris_health_http
        - name: iris-hermes-https
          url: https://athena.${BASE_DOMAIN}/api/health
          module: iris_health_http
        - name: iris-ssh
          url: ${IRIS_MAC_MINI_IP}:22
          module: tcp_connect
        - name: truenas-ui
          url: http://${NAS_IP}/ui/
          module: truenas_ui_http
        - name: truenas-api
          url: http://${NAS_IP}/api/v2.0/system/version/
          module: truenas_api_http
        - name: truenas-nfs
          url: ${NAS_IP}:2049
          module: tcp_connect
