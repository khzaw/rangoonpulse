---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iris-watchdog
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iris-watchdog-health
rules:
  - nonResourceURLs: ["/readyz", "/livez"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iris-watchdog-health
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: iris-watchdog-health
subjects:
  - kind: ServiceAccount
    name: iris-watchdog
    namespace: monitoring
---
# Only metadata is Git-owned. Kubernetes generates the token and CA; never commit its data.
# External, non-expiring identity; restrict to health endpoints and rotate after compromise.
apiVersion: v1
kind: Secret
metadata:
  name: iris-watchdog-api-token
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: iris-watchdog
type: kubernetes.io/service-account-token
