# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/metallb.io/l2advertisement_v1beta1.json
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - default-pool
  # Soft preference (MetalLB 0.16.2+; the editor schema above predates it):
  # the primary announces whenever it is eligible, otherwise another eligible
  # node does. See docs/networking.md.
  preferredNodeSelectors:
    - weight: 100
      preference:
        matchLabels:
          kubernetes.io/hostname: ${PRIMARY_NODE_NAME}
