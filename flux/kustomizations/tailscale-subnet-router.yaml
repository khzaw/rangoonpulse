# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-subnet-router
  namespace: flux-system
spec:
  interval: 24h
  path: ./infrastructure/tailscale-subnet-router
  prune: true
  wait: true
  sourceRef: { kind: GitRepository, name: flux-system }
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  timeout: 5m
  dependsOn:
    - name: tailscale-operator
  healthCheckExprs:
    - apiVersion: tailscale.com/v1alpha1
      kind: ProxyClass
      current: >-
        has(status.conditions) &&
        status.conditions.exists(c, c.type == 'ProxyClassReady' && c.status == 'True' && c.observedGeneration == metadata.generation)
    - apiVersion: tailscale.com/v1alpha1
      kind: Connector
      current: >-
        has(status.conditions) &&
        status.conditions.exists(c, c.type == 'ConnectorReady' && c.status == 'True' && c.observedGeneration == metadata.generation)
