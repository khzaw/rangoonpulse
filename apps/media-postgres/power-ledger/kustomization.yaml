apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - cronjob.yaml
configMapGenerator:
  - name: power-ledger-code
    files:
      - collect.sh
      - collect.sql
      - bootstrap.sql
      - snapshot.sql
    options:
      # Read fresh for every short-lived job; also referenced by the Helm bootstrap hook.
      disableNameSuffixHash: true
