# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: media-postgres
  namespace: default
spec:
  interval: 24h
  timeout: 15m
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install: { remediation: { retries: 3 } }
  upgrade: { remediation: { retries: 3 } }
  values:
    defaultPodOptionsStrategy: merge
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: ${PRIMARY_NODE_NAME}

    controllers:
      main:
        forceRename: media-postgres
        strategy: Recreate
        containers:
          main:
            image:
              repository: timescale/timescaledb
              tag: 2.31.0-pg16
            command:
              - sh
              - -c
            args:
              - |
                set -eu
                exec /usr/local/bin/docker-entrypoint.sh postgres \
                  -c timescaledb.telemetry_level=off \
                  -c max_connections=100 \
                  -c max_locks_per_transaction=2048
            env:
              # Required secret (not in Git): media-postgres-secret (POSTGRES_PASSWORD)
              - name: POSTGRES_USER
                value: postgres
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: media-postgres-secret
                    key: POSTGRES_PASSWORD
              - name: PGDATA
                value: /var/lib/postgresql/data/pgdata

              # Used by init script to create per-app roles/DBs.
              - name: TRACERR_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: tracerr-db-secret
                    key: POSTGRES_PASSWORD
              - name: REACTIVE_RESUME_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: reactive-resume-db-secret
                    key: POSTGRES_PASSWORD
              - name: SPEEDTEST_TRACKER_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: speedtest-tracker-secret
                    key: POSTGRES_PASSWORD
              - name: BOOKORBIT_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secret
                    key: POSTGRES_PASSWORD
            resources:
              requests:
                cpu: "125m"
                memory: "1536Mi"
              limits:
                cpu: "2000m"
                memory: "8Gi"

      # Provision only the isolated ledger table/roles in the existing postgres DB.
      # No database server or new database is created; the collector never gets superuser access.
      power-ledger-database:
        type: job
        serviceAccount:
          name: default
        annotations:
          helm.sh/hook: post-install,post-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        job:
          backoffLimit: 2
          activeDeadlineSeconds: 180
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
        containers:
          main:
            image:
              repository: timescale/timescaledb
              tag: 2.31.0-pg16
            command: [psql, -X, -w, -q, -f, /scripts/bootstrap.sql]
            env:
              PGHOST: media-postgres.default.svc.cluster.local
              PGDATABASE: postgres
              PGUSER: postgres
              PGCONNECT_TIMEOUT: "10"
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: media-postgres-secret
                    key: POSTGRES_PASSWORD
              POWER_LEDGER_WRITER_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: power-ledger-db
                    key: writer-password
              POWER_LEDGER_READER_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: power-ledger-db
                    key: reader-password
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 48Mi

    service:
      main:
        controller: main
        ports:
          postgres:
            port: 5432

    configMaps:
      init:
        enabled: true
        data:
          10-init-app-dbs.sh: |
            (
              set -eu
              echo "Initializing app databases/users (tracearr, reactive_resume, speedtest_tracker, bookorbit) ..."

              # Role: tracearr
              if ! psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_roles WHERE rolname='tracearr'" | grep -q 1; then
                psql -v ON_ERROR_STOP=1 -c "CREATE ROLE tracearr LOGIN PASSWORD '$${TRACERR_DB_PASSWORD}'"
              fi
              # DB: tracearr
              if ! psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname='tracearr'" | grep -q 1; then
                createdb -O tracearr tracearr
              fi

              # Tracerr requires TimescaleDB.
              psql -v ON_ERROR_STOP=1 -d tracearr -c "CREATE EXTENSION IF NOT EXISTS timescaledb"

              # Role: reactive_resume
              if ! psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_roles WHERE rolname='reactive_resume'" | grep -q 1; then
                psql -v ON_ERROR_STOP=1 -c "CREATE ROLE reactive_resume LOGIN PASSWORD '$${REACTIVE_RESUME_DB_PASSWORD}'"
              fi
              # DB: reactive_resume
              if ! psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname='reactive_resume'" | grep -q 1; then
                createdb -O reactive_resume reactive_resume
              fi

              # Role: speedtest_tracker
              if ! psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_roles WHERE rolname='speedtest_tracker'" | grep -q 1; then
                psql -v ON_ERROR_STOP=1 -c "CREATE ROLE speedtest_tracker LOGIN PASSWORD '$${SPEEDTEST_TRACKER_DB_PASSWORD}'"
              fi
              # DB: speedtest_tracker
              if ! psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname='speedtest_tracker'" | grep -q 1; then
                createdb -O speedtest_tracker speedtest_tracker
              fi

              # Role: bookorbit
              if ! psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_roles WHERE rolname='bookorbit'" | grep -q 1; then
                psql -v ON_ERROR_STOP=1 -c "CREATE ROLE bookorbit LOGIN PASSWORD '$${BOOKORBIT_DB_PASSWORD}'"
              fi
              # DB: bookorbit
              if ! psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname='bookorbit'" | grep -q 1; then
                createdb -O bookorbit bookorbit
              fi

              # BookOrbit requires PostgreSQL extensions supplied by this image.
              psql -v ON_ERROR_STOP=1 -d bookorbit -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
              psql -v ON_ERROR_STOP=1 -d bookorbit -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"'
              psql -v ON_ERROR_STOP=1 -d bookorbit -c "CREATE EXTENSION IF NOT EXISTS vector"
            )

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-path
        size: 20Gi
        accessMode: ReadWriteOnce
        advancedMounts:
          main:
            main:
              - path: /var/lib/postgresql/data
      init:
        enabled: true
        type: configMap
        identifier: init
        advancedMounts:
          main:
            main:
              - path: /docker-entrypoint-initdb.d/10-init-app-dbs.sh
                subPath: 10-init-app-dbs.sh
                readOnly: true
      power-ledger-code:
        type: configMap
        name: power-ledger-code
        advancedMounts:
          power-ledger-database:
            main:
              - path: /scripts
                readOnly: true
