[package]
name = "exposure-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Command-line client for the exposure-control API"

[[bin]]
name = "exposure"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde_json = "1.0"
ureq = { version = "3.5", features = ["json"] }
url = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
