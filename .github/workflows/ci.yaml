name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.37.1

      - name: Validate repository
        run: make validate-all

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Check workload CPU headroom
        env:
          CAPACITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python -m pip install PyYAML==6.0.3
          base="$CAPACITY_BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          fi
          python scripts/check_git_capacity.py --base "$base"
