name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.37.1

      - name: Validate repository
        run: make validate-all

      - name: Test power tariff PromQL
        run: |
          python -m pip install PyYAML==6.0.3
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" prometheus-3.15.0.linux-amd64/promtool
          python scripts/test_power_tariff_promql.py --promtool "$RUNNER_TEMP/prometheus-3.15.0.linux-amd64/promtool"

      - name: Test durable monthly power ledger
        run: |
          docker run -d --name power-ledger-sql-test -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16-alpine
          trap 'docker rm -f power-ledger-sql-test >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if docker exec power-ledger-sql-test pg_isready -U postgres; then break; fi
            sleep 1
          done
          python scripts/test_power_ledger_sql.py --psql-command 'docker exec -i power-ledger-sql-test psql -X -U postgres -d postgres'

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Check workload CPU headroom
        env:
          CAPACITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python -m pip install PyYAML==6.0.3
          base="$CAPACITY_BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          fi
          python scripts/check_git_capacity.py --base "$base"
