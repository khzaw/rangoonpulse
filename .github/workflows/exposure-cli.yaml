name: Exposure CLI image

on:
  pull_request:
    paths:
      - apps/exposure-control/cli/**
      - .github/workflows/exposure-cli.yaml
  push:
    branches: [master]
    paths:
      - apps/exposure-control/cli/**
      - .github/workflows/exposure-cli.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exposure-cli-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/khzaw/exposure-cli

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test and build the native image
        uses: docker/build-push-action@v7.4.0
        with:
          context: apps/exposure-control/cli
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/khzaw/exposure-cli:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/khzaw/rangoonpulse
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=exposure-cli-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=exposure-cli-${{ matrix.arch }}

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-architecture manifest
        run: |
          docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
