name: Docs site image

on:
  pull_request:
    paths:
      - docs/**
      - docs-site/**
      - .github/workflows/docs-site.yaml
  push:
    branches: [master]
    paths:
      - docs/**
      - docs-site/**
      - .github/workflows/docs-site.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/khzaw/rangoonpulse-docs

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: docs-site/.nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install and verify docs site
        working-directory: docs-site
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          echo "tag=$(date -u +%s)-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docs-site/Dockerfile
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/khzaw/rangoonpulse
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Static Starlight documentation site for rangoonpulse
          cache-from: type=gha,scope=docs-site
          cache-to: type=gha,mode=max,scope=docs-site
